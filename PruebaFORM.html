<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Multi-Paso</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-lg">
        <h1 class="text-3xl font-bold text-[#0D3238] mb-6 text-center">Registro de Usuario</h1>

        <div class="flex justify-between mb-8">
            <div id="step-1-indicator"
                class="w-1/2 p-2 text-center font-semibold text-white bg-blue-600 rounded-lg transition-colors">Paso 1:
                Datos Personales</div>
            <div id="step-2-indicator"
                class="w-1/2 p-2 text-center font-semibold text-gray-500 bg-gray-200 rounded-lg ml-2 transition-colors">
                Paso 2: Cuenta y Finalizar</div>
        </div>

        <form id="multiStepForm">

            <div id="step1" class="step-content">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Información Personal</h2>

                <div class="mb-4">
                    <label for="name" class="block text-gray-700 font-medium mb-1">Nombre Completo</label>
                    <input type="text" id="name" name="name"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </div>

                <div class="mb-6">
                    <label for="phone" class="block text-gray-700 font-medium mb-1">Teléfono</label>
                    <input type="tel" id="phone" name="phone"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button type="button" onclick="nextStep()"
                    class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
                    Siguiente
                </button>
            </div>

            <div id="step2" class="step-content hidden">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Datos de la Cuenta</h2>

                <div class="mb-4">
                    <label for="email" class="block text-gray-700 font-medium mb-1">Correo Electrónico</label>
                    <input type="email" id="email" name="email"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </div>

                <div class="mb-6">
                    <label for="password" class="block text-gray-700 font-medium mb-1">Contraseña</label>
                    <input type="password" id="password" name="password"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </div>

                <div class="flex justify-between">
                    <button type="button" onclick="prevStep()"
                        class="w-1/3 bg-gray-300 text-gray-700 font-bold py-3 px-4 rounded-lg hover:bg-gray-400 transition duration-200">
                        Atrás
                    </button>
                    <button type="submit"
                        class="w-2/3 bg-green-600 text-white font-bold py-3 px-4 rounded-lg ml-3 hover:bg-green-700 transition duration-200">
                        Finalizar Registro
                    </button>
                </div>
            </div>

        </form>
    </div>
    <script>
        // 1. Variables de estado y elementos
        let currentStep = 1;
        const totalSteps = 2;
        const form = document.getElementById('multiStepForm');

        // 2. Función para actualizar la interfaz
        function updateForm() {
            // Oculta todos los pasos
            document.querySelectorAll('.step-content').forEach((step, index) => {
                step.classList.add('hidden');
                // Quita la clase 'required' temporalmente para evitar que campos invisibles bloqueen 'Siguiente'
                step.querySelectorAll('input').forEach(input => input.removeAttribute('required'));
            });

            // Muestra el paso actual
            const currentStepElement = document.getElementById(`step${currentStep}`);
            currentStepElement.classList.remove('hidden');
            // Vuelve a añadir 'required' a los campos visibles
            currentStepElement.querySelectorAll('input').forEach(input => input.setAttribute('required', ''));

            // Actualiza el indicador visual
            for (let i = 1; i <= totalSteps; i++) {
                const indicator = document.getElementById(`step-${i}-indicator`);
                if (i === currentStep) {
                    indicator.classList.remove('bg-gray-200', 'text-gray-500');
                    indicator.classList.add('bg-blue-600', 'text-white');
                } else {
                    indicator.classList.remove('bg-blue-600', 'text-white');
                    indicator.classList.add('bg-gray-200', 'text-gray-500');
                }
            }
        }

        // 3. Función para avanzar al siguiente paso
        function nextStep() {
            // Validación de campos del paso actual
            const currentInputs = document.getElementById(`step${currentStep}`).querySelectorAll('input[required]');
            let allValid = true;

            currentInputs.forEach(input => {
                if (!input.checkValidity()) {
                    allValid = false;
                    // Muestra el error de validación del navegador
                    input.reportValidity();
                }
            });

            if (allValid && currentStep < totalSteps) {
                currentStep++;
                updateForm();
            }
        }

        // 4. Función para retroceder al paso anterior
        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                updateForm();
            }
        }

        // 5. Inicializar la vista al cargar la página
        updateForm();
    </script>
</body>

</html>
