<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta-name="viewport" content="width=device-width, initial-scale=1.0">
        <title>home</title>
        <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="flex flex-row h-screen bg-[#E9F4F5]">

        <!-- MENU LATERAL -->
        <div id="dad_menu" class="p-4 w-80 h-full flex-shrink-0">
            <div class="w-full h-full px-5 py-10 bg-white flex flex-col rounded-3xl">

                <div id="content_superior">
                    <h3 class="font-bold pb-6 text-center text-xl">Unifilm</h3>

                    <a href="./perfil.html">
                        <div class="flex items-center border border-gray-300 py-3 ps-4 rounded-xl">
                            <img id="img_perfil"
                                src=""
                                alt="Foto de perfil" class="w-14 h-14 rounded-full object-cover">
                            <div class="px-3">
                                <p id="nombre_perfil" class="font-bold text-sm"></p>
                                <p id="rol_perfil" class="text-gray-400 text-xs"></p>
                            </div>
                        </div>
                    </a>

                    <div id="dad_paginas" class="space-y-6 pt-7 px-2 font-medium text-gray-700">
                        <a href="./index.html" class="flex items-center hover:text-blue-600 transition-colors">
                            <img class="inline-block mr-4 w-6 h-6"
                                src="https://cdn-icons-png.flaticon.com/512/1946/1946436.png" alt="Icono Inicio">
                            <span class="font-bold text-black">Inicio</span>
                        </a>

                        <a href="./misPostulaciones.html"
                            class="flex items-center hover:text-blue-600 transition-colors">
                            <img class="inline-block mr-4 w-6 h-6"
                                src="https://cdn-icons-png.flaticon.com/512/2312/2312041.png" alt="Icono Postulaciones">
                            <span>Mis postulaciones</span>
                        </a>

                        <a href="./misConvocatorias.html"
                            class="flex items-center hover:text-blue-600 transition-colors">
                            <img class="inline-block mr-4 w-6 h-6"
                                src="https://cdn-icons-png.flaticon.com/512/1061/1061544.png" alt="Icono Convocatorias">
                            <span>Mis convocatorias</span>
                        </a>

                        <a href="./misProyectos.html" class="flex items-center hover:text-blue-600 transition-colors">
                            <img class="inline-block mr-4 w-6 h-6"
                                src="https://cdn-icons-png.flaticon.com/512/702/702814.png" alt="Icono Proyectos">
                            <span>Mis proyectos</span>
                        </a>
                    </div>
                </div>

                <div id="dad_cerrar" class="mt-auto pt-8">
                    <a href="#"
                        class="flex items-center text-gray-700 hover:text-red-500 transition-colors font-medium">
                        <img class="inline-block mr-4 w-6 h-6"
                            src="https://cdn-icons-png.flaticon.com/512/13430/13430845.png" alt="Icono Cerrar Sesión">
                        <span>Cerrar sesión</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- OPORTUNIDADES PARA TI -->
        <!-- CONTENIDO CENTRAL: OPORTUNIDADES PARA TI -->
        <div id="oportunidades_paraTi" class="flex-grow p-4 overflow-hidden flex flex-col">
            <div class="h-full w-full flex flex-col">
                
                <!-- Encabezado y Filtros -->
                <div class="mb-6">
                    <h2 class="text-3xl font-bold text-[#0D3238] text-center mb-6">Oportunidades para ti</h2>
                    
                    <div class="flex gap-4 max-w-4xl mx-auto w-full">
                        <!-- Buscador -->
                        <div class="flex-grow bg-white rounded-full shadow-sm flex items-center px-4 py-2 border border-transparent hover:border-gray-200 transition-colors">
                            <img src="https://cdn-icons-png.flaticon.com/512/54/54481.png" class="w-4 h-4 opacity-40 mr-3" alt="search">
                            <input type="text" id="buscador-oportunidades" placeholder="Buscar por rol, proyecto..." class="w-full bg-transparent outline-none text-gray-600 placeholder-gray-400">
                        </div>
                        
                        <!-- Filtro Área -->
                        <div class="w-48 bg-white rounded-full shadow-sm px-4 py-2 relative border border-transparent hover:border-gray-200 transition-colors">
                            <select id="filtro-area" class="w-full bg-transparent outline-none text-gray-600 appearance-none cursor-pointer">
                                <option value="">Área</option>
                                <option value="Fotografía">Fotografía</option>
                                <option value="Sonido">Sonido</option>
                                <option value="Arte">Arte</option>
                                <option value="Producción">Producción</option>
                                <option value="Dirección">Dirección</option>
                                <option value="Guion">Guion</option>
                            </select>
                            <img src="https://cdn-icons-png.flaticon.com/512/2985/2985150.png" class="w-3 h-3 absolute right-4 top-1/2 transform -translate-y-1/2 opacity-50 pointer-events-none" alt="arrow">
                        </div>
                    </div>
                </div>

                <!-- Contenedor Scrollable de Tarjetas -->
                <div id="oportunidades-container" class="flex-grow overflow-y-auto pr-2 space-y-4 max-w-4xl mx-auto w-full pb-4">
                    <!-- Aquí se inyectan las tarjetas -->
                    <div class="text-center py-10 text-gray-400">Cargando oportunidades...</div>
                </div>

            </div>
        </div>

        <!-- PERFILES DISPONIBLES -->
        <div id="perfiles_Disponibles" class="flex flex-row w-1/4 p-4 justify-end">
            <div class="h-full w-full bg-[#CDE2E4] rounded-3xl p-6">
                <h2 class="text-2xl font-semibold text-gray-800 text-center">Perfiles disponibles</h2>

                <!-- CONTENEDOR DINÁMICO -->
                <div id="perfiles-container" class="flex flex-col gap-4 mt-4">
                    <!-- Los perfiles se insertan aquí -->
                </div>

            </div>
        </div>
    </div>

    <template id="oportunidad-template">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-transparent hover:border-[#23CCE8] transition-all duration-300 relative group">
            <div class="flex flex-col md:flex-row justify-between items-start gap-4">
                
                <!-- Info Principal -->
                <div class="flex-grow">
                    <h3 id="titulo-convocatoria" class="text-xl font-bold text-gray-800 mb-1">Titulo de la Convocatoria</h3>
                    <p class="text-sm font-semibold text-gray-600 mb-3">
                        Proyecto: <span id="nombre-proyecto" class="font-normal text-gray-800">Nombre del Proyecto</span>
                    </p>
                    
                    <div class="w-12 h-0.5 bg-gray-200 mb-3"></div> <!-- Separador -->

                    <p id="descripcion-convocatoria" class="text-sm text-gray-500 mb-4 leading-relaxed line-clamp-2">
                        Descripción breve de la convocatoria...
                    </p>

                    <div class="flex flex-wrap gap-y-1 gap-x-6 text-sm">
                        <p class="text-gray-500">Área Requerida: <span id="area-requerida" class="font-bold text-gray-800">Rol</span></p>
                        <p class="text-gray-500 italic">Hasta el <span id="fecha-cierre" class="font-medium text-gray-700">DD/MM/AAAA</span></p>
                    </div>
                </div>

                <!-- Botón de Acción -->
                <div class="flex-shrink-0 self-end md:self-center mt-2 md:mt-0">
                    <button id="btn-postularme" class="bg-gradient-to-r from-[#23CCE8] to-[#0FF0DE] text-white font-bold py-2 px-8 rounded-full shadow-md hover:shadow-lg hover:scale-105 transition-all duration-300">
                        Postularme
                    </button>
                </div>
            </div>
        </div>
    </template>

    

    <!-- TEMPLATE INVISIBLE PARA TARJETAS -->
    <template id="perfil-template">
        <div class="bg-white w-full rounded-3xl">
            <div id="id_participantes" class="hidden"></div>
        
            <div id="perfil_participantes " class="pointer">
                    <div class="flex items-center py-3 ps-4 rounded-xl">
                        <img id="img_participantes"
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQgGVslZPcLCSkPtpM5-XBaZ6-y8yTGdXd-Fg&s"
                            alt="Foto de perfil" class="w-14 h-14 rounded-full object-cover">
                        <div class="px-3">
                            <p id="nombre_ofertante" class="font-bold text-sm"></p>
                            <p id="rol_ofertante" class="text-gray-400 text-xs"></p>
                        </div>
                    </div>
               
            </div>
            <div id="sombra negra" class="w-2/3 ms-3 border-b-2 border-gray-400 pt-2"></div>
            <div class=" py-3 ps-6">
                <span class="">
                    <div>
                        <b>Disponibilidad: </b>
                        <b id="estado_ofertante" class="text-green-500"></b>
                        <div class="rounded-full w-4 h-4 border border-green-500 inline-block align-middle">
                            <div
                                class="rounded-full w-3 h-3 bg-green-500 relative top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
                            </div>
                        </div>
                        <div>
                            <b class="inline-block font-semibold text-gray-600 align-middle ml-1"> Desde: </b>
                            <b id="fecha_inicio_ofertante" class="inline-block font-bold text-green-500 align-middle ml-1"></b>
                            <b class="inline-block font-semibold text-gray-600 align-middle ml-1"> Hasta: </b>
                            <b id="fecha_fin_ofertante" class="inline-block font-bold text-green-500 align-middle ml-1"></b>
                        </div>



                </span>
            </div>
        </div>
    </template>

    <!-- Toasted Notifications -->
    <div id="correct_toasted" class="hidden fixed bottom-5 right-5 z-50 bg-green-600 text-white px-6 py-3 rounded-l-2xl shadow-xl flex items-center gap-3 transition-transform transform translate-x-0">
        <span id="toasted_message_content" class="font-semibold">Acción exitosa</span>
        <img class="w-6 h-6 invert" src="https://cdn-icons-png.flaticon.com/512/5290/5290058.png" alt="Check">
    </div>
    
    <div id="inCorrect_toasted" class="hidden fixed bottom-5 right-5 z-50 bg-red-600 text-white px-6 py-3 rounded-l-2xl shadow-xl flex items-center gap-3 transition-transform transform translate-x-0">
        <span id="toasted_message_content" class="font-semibold">Error</span>
        <img class="w-6 h-6 invert" src="https://cdn-icons-png.flaticon.com/512/399/399274.png" alt="Error">
    </div>


    <!-- SCRIPTS -->

    <script src="./js/microservices/convocatoria.js"></script>
    <script src="./js/microservices/postulante.js"></script>
    <script src="./js/microservices/ofertantes.js"></script>
    <script src="./js/microservices/proyecto.js"></script>
    <script src="./js/utilities.js"></script>


    <script>
        cargarOportunidades(); //convocatoria.js
        cargarPerfilesDisponibles(); //ofertantes.js
        consultarInfoUsuario(); //utilities.js
    </script>
</body>

</html>
