<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>convocatorias</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="flex flex-row h-screen bg-[#E9F4F5]">

        <div id="dad_menu" class="p-4 w-80 h-full flex-shrink-0">
            <div class="w-full h-full px-5 py-10 bg-white flex flex-col rounded-3xl">
                <div id="content_superior">
                    <h3 class="font-bold pb-6 text-center text-xl">Unifilm</h3>
                    <a href="./perfil.html">
                        <div class="flex items-center border border-gray-300 py-3 ps-4 rounded-xl">
                            <img id="img_perfil"
                                src="https://images.squarespace-cdn.com/content/v1/5f632bf01807e96e340523c0/1652985648211-C73XPXO1FDM1YXHTV6SA/buyer-persona-branding"
                                alt="Foto de perfil" class="w-14 h-14 rounded-full object-cover">
                            <div class="px-3">
                                <p id="nombre_perfil" class="font-bold text-sm">Michael Rodriguez</p>
                                <p id="rol_perfil" class="text-gray-400 text-xs">Fotografía</p>
                            </div>
                        </div>
                    </a>

                    <div id="dad_paginas" class="space-y-6 pt-7 px-2 font-medium text-gray-700">
                        <a href="./index.html" class="flex items-center hover:text-blue-600 transition-colors">
                            <img class="inline-block mr-4 w-6 h-6"
                                src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png" alt="Icono Inicio">
                            <span>Inicio</span>
                        </a>
                        <a href="./misPostulaciones.html"
                            class="flex items-center hover:text-blue-600 transition-colors">
                            <img class="inline-block mr-4 w-6 h-6"
                                src="https://cdn-icons-png.flaticon.com/512/2312/2312041.png" alt="Icono Postulaciones">
                            <span>Mis postulaciones</span>
                        </a>
                        <a href="./misConvocatorias.html"
                            class="flex items-center hover:text-blue-600 transition-colors">
                            <img class="inline-block mr-4 w-6 h-6"
                                src="https://cdn-icons-png.flaticon.com/512/584/584597.png" alt="Icono Convocatorias">
                            <span class="font-bold text-black">Mis convocatorias</span>
                        </a>
                        <a href="./misProyectos.html" class="flex items-center hover:text-blue-600 transition-colors">
                            <img class="inline-block mr-4 w-6 h-6"
                                src="https://cdn-icons-png.flaticon.com/512/702/702814.png" alt="Icono Proyectos">
                            <span>Mis proyectos</span>
                        </a>
                    </div>
                </div>
                <div id="dad_cerrar" class="mt-auto pt-8">
                    <a href="#"
                        class="flex items-center text-gray-700 hover:text-red-500 transition-colors font-medium">
                        <img class="inline-block mr-4 w-6 h-6"
                            src="https://cdn-icons-png.flaticon.com/512/13430/13430845.png" alt="Icono Cerrar Sesión">
                        <span>Cerrar sesión</span>
                    </a>
                </div>
            </div>
        </div>

        <div id="main_content" class="flex-grow p-4">

            <div class="h-full w-full rounded-3xl p-6">
                <div id="dad_buscador_y_grid" class="flex flex-col h-full">

                    <div id="dad_buscador" class="flex-shrink-0">
                        <h1 class="py-5 text-3xl font-bold text-gray-800">Mis convocatorias</h1>
                        <div id="buscador" class="py-5 flex items-center gap-5">
                            <form class="flex items-center bg-white shadow-md rounded-3xl border border-gray-300">
                                <input type="text" name="convocatorias_buscador" id="convocatorias_buscador"
                                    placeholder="Buscar..." class="px-4 py-3 w-72 focus:outline-none rounded-l-3xl">
                                <button type="submit" class="pe-3 rounded-r-3xl font-bold">
                                    <img class="w-6" src="https://cdn-icons-png.flaticon.com/512/16/16492.png"
                                        alt="Icono buscar">
                                </button>
                            </form>

                            <div>
                                <button type="button"
                                    class="py-3 px-8 bg-gradient-to-r from-[#23CCE8] to-[#0FF0DE] text-white rounded-3xl font-bold shadow-md hover:shadow-xl hover:scale-105 transition duration-300 ease-in-out">
                                    + agregar
                                </button>
                            </div>
                        </div>
                    </div>

                    <div id="dad_convocatoriasGrid" class="flex-grow overflow-y-auto pt-4">
                        <template id="convocatoria-template">
                            <div id="template-card"
                                class="bg-white border border-[#CDE2E4] rounded-xl p-6 flex flex-col space-y-4 shadow-sm">
                                <div id="head_card" class="space-y-2">
                                    <h3 id="nombre_convocatoria"
                                        class="font-bold text-2xl md:text-3xl text-gray-900 leading-tight pb-3">
                                        Asistente de Producción para cortometraje estudiantil</h3>
                                    <b class="text-lg font-normal text-gray-700">Proyecto: <span id="titulo_proyecto"
                                            class="font-bold ">Fragmentos del Viento</span></b>
                                    <div class="w-1/3 border-b-2 border-gray-400 pt-2"></div>
                                </div>
                                <div id="body_card" class="space-y-4">
                                    <div id="descripcion_container">
                                        <p id="descripcion_convocatoria" class="text-gray-600">
                                            Apoya la logística del rodaje, coordina al equipo y supervisa que el
                                            plan de
                                            trabajo se cumpla.
                                        </p>
                                    </div>
                                    <div class="text-sm">
                                        <p class="inline text-gray-600">Área Requerida: </p>
                                        <p id="area_requerida" class="inline font-bold text-gray-900">Dirección de
                                            fotografía</p>
                                    </div>
                                    <div class="text-sm">
                                        <p class="inline italic text-gray-600">Hasta el </p>
                                        <p id="fechaMax_convocatoria" class="inline italic font-normal text-gray-900">
                                            17/01/2026</p>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <div id="convocatorias-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                        </div>
                    </div>

                </div>
            </div>
        </div>
</body>

</html>
