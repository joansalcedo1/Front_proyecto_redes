<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>convocatorias</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body onload="getAllconvocatorias(); ">
    <!--este es el div del modal-->
    <div id="modal-container" class="fixed inset-0 z-50 hidden">

        <div id="modal-overlay" class="fixed inset-0  backdrop-filter backdrop-blur-lg"></div>
        <div class="flex items-center justify-center min-h-screen">
            <div id="modal-box" class="bg-white p-8 rounded-lg shadow-2xl relative max-w-lg w-full mx-4">

                <div class="flex justify-between items-center space-x-7">
                    <h2 class="text-2xl font-bold mb-4">Crea una convocatoria</h2>

                    <button id="close-modal-btn" onclick="closeModal()"
                        class="font-bold text-gray-600 px-8 py-2 rounded hover:bg-red-500 hover:text-white transition">
                        X
                    </button>
                </div>


                <form action="POST">
                    <div class="flex flex-col gap-5">
                        <div>
                            <label for="titulo_convocatoria_input" class="">Titulo</label>
                            <input type="text" name="titulo_convocatoria_input" id="titulo_convocatoria"
                                placeholder="Gaffer para proyecto de grado..."
                                class="px-4 py-3 mt-2 w-full focus:outline-none rounded-3xl border" required>
                        </div>
                        <div>
                            <label for="descripcion_convocatoria_input">Descripcion</label>
                            <textarea id="descripcion_convocatoria_input" name="descripcion_convocatoria" rows="4"
                                class="w-full  p-3 border border-gray-300 rounded-3xl
                                focus:outline-none focus:ring-2 focus:ring-blue-300 resize-y transition duration-150 ease-in-out mt-2"
                                placeholder="Soy gaffer con amplia experiencia en...(500 caracteres max)"
                                maxlength="500" required></textarea>
                        </div>
                        <div>
                            <label for="titulo_proyecto_input">titulo del proyecto</label>
                            <select id="titulo_proyecto_input" name="titulo_proyecto"
                                class="w-full p-3 border border-gray-300 rounded-3xl
                                focus:outline-none focus:ring-2 focus:ring-blue-300 resize-y transition duration-150 ease-in-out mt-2" required>
                                1
                            </select>
                        </div>
                        <div class="flex space-x-4">
                            <div class="flex flex-col w-full">
                                <label for="area_requerida_input"
                                    class="text-base text-gray-700 mb-1 font-semibold">Area
                                    requerida:</label>
                                <input type="text" id="area_requerida_input" name="area_requerida_input" placeholder=""
                                    class="px-4 py-2 border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition duration-150 ease-in-out"
                                    readonly>
                            </div>

                            <div class="flex flex-col w-1/3">
                                <label for="cantidad"
                                    class="text-base text-gray-700 mb-1 font-semibold">Cantidad:</label>
                                <input type="number" id="cantidad" name="cantidad" placeholder=""
                                    class="px-4 py-2 border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition duration-150 ease-in-out"
                                    required>
                            </div>
                        </div>
                        <div>
                            <label for="fecha_fin_input">fecha fin</label>
                            <input type="date" id="fecha_fin_input" name="fecha_fin_input"
                                class="w-full p-3 border border-gray-300 rounded-3xl
                                focus:outline-none focus:ring-2 focus:ring-blue-300 resize-y transition duration-150 ease-in-out mt-2" required>
                        </div>
                        <div class="mx-auto">
                            <button type="submit" id="open-modal-btn" onclick="openModal()"
                                class="py-3 px-8 bg-gradient-to-r from-[#23CCE8] to-[#0FF0DE] text-white rounded-3xl font-bold shadow-md hover:shadow-xl hover:scale-105 transition duration-300 ease-in-out">
                                confirmar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="flex flex-row h-screen bg-[#E9F4F5]">
        <div id="dad_menu" class="p-4 w-80 h-full flex-shrink-0">
            <div class="w-full h-full px-5 py-10 bg-white flex flex-col rounded-3xl">
                <div id="content_superior">
                    <h3 class="font-bold pb-6 text-center text-xl">Unifilm</h3>
                    <a href="./perfil.html">
                        <div class="flex items-center border border-gray-300 py-3 ps-4 rounded-xl">
                            <img id="img_perfil"
                                src="https://images.squarespace-cdn.com/content/v1/5f632bf01807e96e340523c0/1652985648211-C73XPXO1FDM1YXHTV6SA/buyer-persona-branding"
                                alt="Foto de perfil" class="w-14 h-14 rounded-full object-cover">
                            <div class="px-3">
                                <p id="nombre_perfil" class="font-bold text-sm">Michael Rodriguez</p>
                                <p id="rol_perfil" class="text-gray-400 text-xs">Fotografía</p>
                            </div>
                        </div>
                    </a>

                    <div id="dad_paginas" class="space-y-6 pt-7 px-2 font-medium text-gray-700">
                        <a href="./index.html" class="flex items-center hover:text-blue-600 transition-colors">
                            <img class="inline-block mr-4 w-6 h-6"
                                src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png" alt="Icono Inicio">
                            <span>Inicio</span>
                        </a>
                        <a href="./misPostulaciones.html"
                            class="flex items-center hover:text-blue-600 transition-colors">
                            <img class="inline-block mr-4 w-6 h-6"
                                src="https://cdn-icons-png.flaticon.com/512/2312/2312041.png" alt="Icono Postulaciones">
                            <span>Mis postulaciones</span>
                        </a>
                        <a href="./misConvocatorias.html"
                            class="flex items-center hover:text-blue-600 transition-colors">
                            <img class="inline-block mr-4 w-6 h-6"
                                src="https://cdn-icons-png.flaticon.com/512/584/584597.png" alt="Icono Convocatorias">
                            <span class="font-bold text-black">Mis convocatorias</span>
                        </a>
                        <a href="./misProyectos.html" class="flex items-center hover:text-blue-600 transition-colors">
                            <img class="inline-block mr-4 w-6 h-6"
                                src="https://cdn-icons-png.flaticon.com/512/702/702814.png" alt="Icono Proyectos">
                            <span>Mis proyectos</span>
                        </a>
                    </div>
                </div>
                <div id="dad_cerrar" class="mt-auto pt-8">
                    <a href="#"
                        class="flex items-center text-gray-700 hover:text-red-500 transition-colors font-medium">
                        <img class="inline-block mr-4 w-6 h-6"
                            src="https://cdn-icons-png.flaticon.com/512/13430/13430845.png" alt="Icono Cerrar Sesión">
                        <span>Cerrar sesión</span>
                    </a>
                </div>
            </div>
        </div>

        <div id="dad_convocatorias" class="flex-grow p-4">
            <div class="h-full w-full rounded-3xl p-6">
                <div id="dad_buscador_y_grid" class="flex flex-col h-full">

                    <div id="dad_buscador" class="flex-shrink-0">
                        <h1 class="py-5 text-3xl font-bold text-gray-800">Mis convocatorias</h1>
                        <div id="buscador" class="py-5 flex items-center gap-5">
                            <form class="flex items-center bg-white shadow-md rounded-3xl border border-gray-300">
                                <input type="text" name="convocatorias_buscador" id="convocatorias_buscador"
                                    placeholder="Buscar..." class="px-4 py-3 w-72 focus:outline-none rounded-l-3xl">
                                <button type="submit" class="pe-3 rounded-r-3xl font-bold">
                                    <img class="w-6" src="https://cdn-icons-png.flaticon.com/512/16/16492.png"
                                        alt="Icono buscar">
                                </button>
                            </form>

                            <div>
                                <button type="button" id="open-modal-btn" onclick="openModal()"
                                    class="py-3 px-8 bg-gradient-to-r from-[#23CCE8] to-[#0FF0DE] text-white rounded-3xl font-bold shadow-md hover:shadow-xl hover:scale-105 transition duration-300 ease-in-out">
                                    + agregar
                                </button>

                            </div>
                        </div>
                    </div>

                    <div id="dad_convocatoriasGrid" class="flex-grow overflow-y-auto pt-4">
                        <template id="convocatoria-template">
                            <div id="template-card"
                                class="bg-white border border-[#CDE2E4] rounded-xl p-6 flex flex-col space-y-4 shadow-sm">
                                <button id="btn_convocatoria">
                                    <div id="id_convocatoria" class="hidden"></div>
                                    <div id="head_card" class="space-y-2">
                                        <h3 id="nombre_convocatoria"
                                            class="font-bold text-2xl md:text-3xl text-gray-900 leading-tight pb-3">
                                        </h3>
                                        <b class="text-lg font-normal text-gray-700">Proyecto:
                                            <span id="titulo_proyecto" class="font-bold "></span>
                                        </b>
                                        <div class="w-1/3 border-b-2 border-gray-400 pt-2"></div>
                                    </div>
                                    <div id="body_card" class="space-y-4">
                                        <div id="descripcion_container">
                                            <p id="descripcion_convocatoria" class="text-gray-600"></p>
                                        </div>
                                        <div class="text-sm">
                                            <p class="inline text-gray-600">Área Requerida: </p>
                                            <p id="area_requerida_convocatoria" class="inline font-bold text-gray-900">
                                            </p>
                                        </div>
                                        <div class="text-sm">
                                            <p class="inline italic text-gray-600">Hasta el </p>
                                            <p id="fechaMax_convocatoria"
                                                class="inline italic font-normal text-gray-900">
                                            </p>
                                        </div>
                                    </div>
                                </button>
                            </div>
                        </template>
                        <div id="convocatorias-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div id="dad_postulantes" class="flex flex-row w-1/3 p-4 justify-end">
            <div id="content_dad_postulantes" class="h-full w-full bg-[#CDE2E4] rounded-3xl p-6">
                    <h3 class="py-5 text-3xl font-bold text-gray-800">Perfiles interesados</h3>
                <div id="postulante-grid" class="grid grid-cols-1 gap-6 ">
                    <template id="card_postulantes_template">
                        <div class="bg-white w-full rounded-3xl">
                            <div id="perfil_postulantes">
                                <a href="./perfil.html">
                                    <div class="flex items-center py-3 ps-4 rounded-xl">
                                        <img id="img_postulante"
                                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQgGVslZPcLCSkPtpM5-XBaZ6-y8yTGdXd-Fg&s"
                                            alt="Foto de perfil" class="w-14 h-14 rounded-full object-cover">
                                        <div class="px-3">
                                            <p id="nombre_postulante" class="font-bold text-sm"></p>
                                            <p id="rol_postulante" class="text-gray-400 text-xs"></p>
                                        </div>
                                    </div>
                                </a>
                            </div>
                            <div id="sombra negra" class="w-60 ms-3 border-b-2 border-gray-400 pt-2"></div>
                            <div class="flex flex-col py-3 ps-6">
                                <span class="inline-block">
                                    <b>Estado: </b>
                                    <div class="rounded-full w-4 h-4 border border-gray-500 inline-block align-middle">
                                        <div
                                            class="rounded-full w-3 h-3 bg-gray-500 relative top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
                                        </div>
                                    </div>
                                    <b id="estado_postulante"
                                        class="inline-block font-bold text-gray-500 align-middle ml-1"></b>

                                </span>
                            </div>
                            <div class="flex justify-center space-x-7 pt-2 pb-4">
                                <button onclick="rechazarPostulante()"
                                    class="px-4 py-2 bg-green-500 rounded-3xl hover:bg-green-800 hover: text-white">
                                    Aceptar
                                </button>
                                <button onclick="aceptarPostulante()"
                                    class="px-4 py-2 bg-red-500 border rounded-3xl hover:bg-red-800 hover: text-white">
                                    Rechazar
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
    <script src="./services.js"></script>
    <script>
        // 1. Obtener los elementos clave del DOM
        const modalContainer = document.getElementById('modal-container');
        const openBtn = document.getElementById('open-modal-btn');
        const closeBtn = document.getElementById('close-modal-btn');
        const overlay = document.getElementById('modal-overlay');

        // 2. Función para Abrir el Modal
        function openModal() {
            // Elimina la clase 'hidden' para mostrar el modal
            modalContainer.classList.remove('hidden');
            // Opcional: añade una clase para animaciones si las deseas
            console.log("abriendo modal")
        }

        // 3. Función para Cerrar el Modal
        function closeModal() {
            // Añade la clase 'hidden' para ocultar el modal
            modalContainer.classList.add('hidden');
        }


    </script>
</body>

</html>
