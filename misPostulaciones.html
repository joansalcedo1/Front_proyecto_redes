<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>postulaciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="flex flex-row h-screen bg-[#E9F4F5]">

        <div id="dad_menu" class="p-4 w-80 h-full flex-shrink-0">

            <div class="w-full h-full px-5 py-10 bg-white flex flex-col rounded-3xl">
                <a href="./perfil.html">
                    <div id="content_superior">
                        <h3 class="font-bold pb-6 text-center text-xl">Unifilm</h3>

                        <div class="flex items-center border border-gray-300 py-3 ps-4 rounded-xl">
                            <img id="img_perfil"
                                src="https://images.squarespace-cdn.com/content/v1/5f632bf01807e96e340523c0/1652985648211-C73XPXO1FDM1YXHTV6SA/buyer-persona-branding"
                                alt="Foto de perfil" class="w-14 h-14 rounded-full object-cover">
                            <div class="px-3">
                                <p id="nombre_perfil" class="font-bold text-sm">Michael Rodriguez</p>
                                <p id="rol_perfil" class="text-gray-400 text-xs">Fotografía</p>
                            </div>
                        </div>
                </a>
                <div id="dad_paginas" class="space-y-6 pt-7 px-2 font-medium text-gray-700">
                    <a href="./index.html" class="flex items-center hover:text-blue-600 transition-colors">
                        <img class="inline-block mr-4 w-6 h-6"
                            src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png" alt="Icono Inicio">
                        <span>Inicio</span>
                    </a>
                    <a href="./misPostulaciones.html" class="flex items-center hover:text-blue-600 transition-colors">
                        <img class="inline-block mr-4 w-6 h-6"
                            src="https://cdn-icons-png.flaticon.com/512/2312/2312472.png" alt="Icono Postulaciones">
                        <span class="font-bold text-black">Mis postulaciones</span>
                    </a>
                    <a href="./misConvocatorias.html" class="flex items-center hover:text-blue-600 transition-colors">
                        <img class="inline-block mr-4 w-6 h-6"
                            src="https://cdn-icons-png.flaticon.com/512/1061/1061544.png" alt="Icono Convocatorias">
                        <span>Mis convocatorias</span>
                    </a>
                    <a href="./misProyectos.html" class="flex items-center hover:text-blue-600 transition-colors">
                        <img class="inline-block mr-4 w-6 h-6"
                            src="https://cdn-icons-png.flaticon.com/512/702/702814.png" alt="Icono Proyectos">
                        <span>Mis proyectos</span>
                    </a>

                </div>
            </div>

            <div id="dad_cerrar" class="mt-auto pt-8">
                <a href="#" class="flex items-center text-gray-700 hover:text-red-500 transition-colors font-medium">
                    <img class="inline-block mr-4 w-6 h-6"
                        src="https://cdn-icons-png.flaticon.com/512/13430/13430845.png" alt="Icono Cerrar Sesión">
                    <span>Cerrar sesión</span>
                </a>
            </div>
        </div>
    </div>

    <div id="main_content" class="flex-grow p-4">
        <div class="h-full w-full bg-[#E9F4F5] rounded-3xl p-6 flex gap-6">

            <!-- LISTA DE POSTULACIONES -->
            <div class="flex-1 flex flex-col gap-4 overflow-y-auto">
        
                <h1 class="text-3xl font-bold text-gray-800 mb-4">Mis postulaciones</h1>
        
                <!-- Contenedor dinámico -->
                <div id="postulaciones-container" class="flex flex-col gap-6"></div>
        
                <!-- TEMPLATE -->
                <template id="postulacion-template">
                    <div class="bg-white border border-gray-200 rounded-3xl p-6 shadow-md">
        
                        <h3 id="titulo_post" class="text-xl font-bold text-gray-900"></h3>
        
                        <p class="text-sm">
                            <b>Proyecto:</b> <span id="proyecto_post" class="text-gray-700"></span>
                        </p>
        
                        <div class="border-b border-gray-400 w-1/3 my-2"></div>
        
                        <p class="flex items-center gap-2 text-sm">
                            <span id="estado_icon"></span>
                            <b id="estado_post"></b>
                        </p>
        
                        <p class="text-sm mt-1">
                            <b>Área requerida:</b>
                            <span id="area_post" class="font-semibold text-gray-700"></span>
                        </p>
        
                        <p class="text-sm text-gray-600">
                            <b>Hasta el:</b>
                            <span id="fecha_post"></span>
                        </p>
        
                        <div class="flex justify-end mt-4">
                            <button id="btn_cancelar" 
                                class="bg-[#34C9C9] hover:bg-[#29b3b3] text-white font-semibold px-5 py-2 rounded-full">
                                Cancelar postulación
                            </button>
                        </div>
        
                    </div>
                </template>
        
            </div>
        
            <!-- OFERTA DE DISPONIBILIDAD -->
            <div class="w-80 bg-[#CDE2E4] rounded-3xl p-6">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">Oferta tu disponibilidad</h3>
        
                <div class="flex flex-col gap-3">
        
                    <label class="text-sm font-semibold text-gray-700">Desde:</label>
                    <input type="date" id="disp_desde"
                        class="w-full px-3 py-2 border border-gray-300 rounded-xl">
        
                    <label class="text-sm font-semibold text-gray-700">Hasta:</label>
                    <input type="date" id="disp_hasta"
                        class="w-full px-3 py-2 border border-gray-300 rounded-xl">
        
                    <button id="btn_publicar_disp"
                        class="bg-[#34C9C9] hover:bg-[#29b3b3] text-white font-semibold px-5 py-2 rounded-full mt-4">
                        Publicar
                    </button>
        
                </div>
            </div>
        
        </div>
        
    </div>
    </div>
    <script src="./js/utilities.js"></script>
    <script src="./js/microservices/convocatoria.js"></script>
    <script src="./js/microservices/postulante.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            consultarInfoUsuario()
        });
    </script>
</body>

</html>
