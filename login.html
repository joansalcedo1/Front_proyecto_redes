<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
   
</head>

<body class="bg-no-repeat bg-fixed bg-cover h-screen" style="background-image: url('./media/BG.jpg');">
    <div id="dad_form" class="flex flex-col items-center justify-center h-screen">
        <div id="content_form" class="bg-white w-1/3 px-20 py-10 rounded-3xl shadow-md">
            <h1 class="font-bold pb-6 text-center text-[#0D3238] text-4xl">Bienvenido de nuevo</h1>
            <div id="error-message" class="p-4 hidden rounded bg-red-500 text-white mb-4 ">
                <p>Credenciales incorrectas</p>
            </div>
            <form onsubmit="iniciarSesion(event)" action="" method="POST">
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 font-bold mb-2">Email</label>
                    <input type="text" id="email" name="email"
                        class="w-full px-3 py-2 border border-gray-300 rounded-2xl focus:outline-none focus:ring focus:border-blue-300"
                        required>
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-gray-700 font-bold mb-2">Password</label>
                    <div class="flex flex-row">
                        <input type="password" id="password" name="password"
                            class="w-full px-3 py-2 border rounded-2xl border-gray-300 focus:outline-none focus:ring focus:border-blue-300"
                            required>
                        <button type="button" onclick="togglePasswordVisibility()">
                            <img id="iconPassword" src="https://cdn-icons-png.flaticon.com/512/6684/6684701.png"
                                alt="ver/noVer" class="w-6 h-6 m-2 ">
                        </button>
                    </div>
                </div>
                <div class="flex flex-col gap-4 ">
                    <button type="submit" class="bg-gradient-to-r from-[#23CCE8] to-[#0FF0DE] 
        text-white font-bold py-3 px-8 rounded-3xl shadow-md
        hover:shadow-xl hover:scale-105 transition duration-300 ease-in-out">Iniciar sesion</button>
                    <p class="text-sm text-center">¿Aún no tienes cuenta? <a href="register.html"
                            class="text-blue-500">Regístrate aquí</a></p>
                </div>
            </form>
        </div>
    </div>
    <script src="services.js"></script>

</body>

</html>
