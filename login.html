<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-no-repeat bg-fixed bg-cover min-h-screen flex items-center justify-center"
    style="background-image: url('./media/BG.jpg');">

    <div id="dad_form" class="w-full flex items-center justify-center px-4 py-10">

        <!-- FORM RESPONSIVO -->
        <div id="content_form" class="bg-white w-full sm:w-3/4 md:w-2/3 lg:w-2/5 xl:w-1/3 2xl:w-1/4 
                   px-6 sm:px-10 md:px-14 lg:px-16 xl:px-20 
                   py-10 rounded-3xl shadow-md">

            <h1 class="font-bold pb-6 text-center text-[#0D3238] text-3xl sm:text-4xl">
                Bienvenido de nuevo
            </h1>

            <!-- ERROR -->
            <div id="error-message" class="hidden p-4 rounded bg-red-500 text-white mb-4">
                <p>Credenciales incorrectas</p>
            </div>

             <!-- FORM -->
            <form id="login-form" onsubmit="inicioSesion(event)">

                <!-- EMAIL -->
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 font-bold mb-2">Email</label>
                    <input type="text" id="email" name="email" class="w-full px-3 py-2 border border-gray-300 rounded-2xl 
                               focus:outline-none focus:ring focus:border-blue-300" required>
                </div>

                <!-- PASSWORD -->
                <div class="mb-6">
                    <label for="password" class="block text-gray-700 font-bold mb-2">Password</label>
                    <div class="flex flex-row items-center">
                        <input type="password" id="password" name="password" class="w-full px-3 py-2 border border-gray-300 rounded-2xl 
                                   focus:outline-none focus:ring focus:border-blue-300" required>

                        <button type="button" onclick="togglePasswordVisibility()" class="ml-2 p-1">
                            <img id="iconPassword" src="https://cdn-icons-png.flaticon.com/512/6684/6684701.png"
                                alt="ver/noVer" class="w-6 h-6">
                        </button>
                    </div>
                </div>

                <!-- BOTÓN LOGIN -->
                <div class="flex flex-col gap-4">
                    <button type="submit" class="bg-gradient-to-r from-[#23CCE8] to-[#0FF0DE] 
                               text-white font-bold py-3 rounded-3xl shadow-md
                               hover:shadow-xl hover:scale-105 transition duration-300 ease-in-out">
                        Iniciar sesión
                    </button>

                    <p class="text-sm text-center">
                        ¿Aún no tienes cuenta?
                        <a href="register.html" class="text-blue-500 font-semibold">
                            Regístrate aquí
                        </a>
                    </p>
                </div>

            </form>
        </div>
    </div>

    <!--Aqui estan los toasted-->
    <div id="correct_toasted"
        class="hidden rounded-l-3xl text-white absolute bottom-7 right-0 z-999 w-1/4 h-30 bg-green-800">
        <div id="dad_toasted_message" class="font-semibold px-4 py-2 flex items-center ">
            <span id="toasted_message_content" class="px-4 inline "></span>
            <img class="w-11 " src="https://cdn-icons-png.flaticon.com/512/5290/5290058.png" alt="">
        </div>
    </div>
    <div id="noCorrect_toasted"
        class="hidden rounded-l-3xl text-white absolute bottom-7 right-0 z-999 w-1/4 h-30 bg-red-800">
        <div id="toasted_message" class="font-semibold px-4 py-2 flex items-center">
            <span class="px-4 inline ">Hubo un problema agregando el usuario <p id="id_usuario" class="inline"></p>
            </span>
            <img class="w-11 " src="https://cdn-icons-png.flaticon.com/512/399/399274.png" alt="">
        </div>
    </div>



    <!-- Scripts -->
    <script src="./js/microservices/convocatoria.js"></script>
    <script src="./js/microservices/postulante.js"></script>
    <script src="./js/microservices/usuarios.js"></script>
    <script src="./js/utilities.js"></script>

</body>

</html>
