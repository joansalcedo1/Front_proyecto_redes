<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        //modifica la vista del password
        function toggleRPasswordVisibility() {
            const passwordInput = document.getElementById('RPassword');
            const imgIcon = document.getElementById('iconRPassword');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            const icon = passwordInput.getAttribute('type') === 'password' ? 'https://cdn-icons-png.flaticon.com/512/9759/9759281.png' : 'https://cdn-icons-png.flaticon.com/512/6684/6684701.png ';
            passwordInput.setAttribute('type', type);
            imgIcon.setAttribute('src', icon);
        }
    </script>
</head>

<body class="bg-no-repeat bg-fixed bg-cover h-screen" style="background-image: url('./media/BG.jpg');">
    <div id="dad_form" class="flex flex-col items-center justify-center h-screen">
        <div id="content_form" class="bg-white p-8 rounded-3xl shadow-md w-1/3 ">
            <div id="titulo" class="py-5">
                <h1 class="font-bold pb-6 text-center text-3xl">Tu próxima producción empieza aquí</h1>
            </div>
            <form id="multipleForm" onsubmit="registroUsuarios(event)">
                <div id="step1" class="step-content">
                    <div class="mb-4">
                        <label for="firstname" class="block text-gray-700 font-bold mb-2">Nombre</label>
                        <input type="text" id="firstname" name="firstname"
                            class="w-full px-3 py-2 border border-gray-300 rounded-2xl focus:outline-none focus:ring focus:border-blue-300"
                            required>
                    </div>
                    <div class="mb-4">
                        <label for="lastname" class="block text-gray-700 font-bold mb-2">Apellido</label>
                        <input type="text" id="lastname" name="lastname"
                            class="w-full px-3 py-2 border border-gray-300 rounded-2xl focus:outline-none focus:ring focus:border-blue-300"
                            required>
                    </div>
                    <div class="mb-4">
                        <label for="email" class="block text-gray-700 font-bold mb-2">E-mail</label>
                        <input type="email" id="email" name="email"
                            class="w-full px-3 py-2 border border-gray-300 rounded-2xl focus:outline-none focus:ring focus:border-blue-300"
                            required>
                    </div>
                    <div class="mb-6">
                        <label for="password" class="block text-gray-700 font-bold mb-2">Password</label>
                        <div class="flex flex-row">
                            <input type="password" id="password" name="password"
                                class="w-full px-3 py-2 border rounded-2xl border-gray-300 rounded focus:outline-none focus:ring focus:border-blue-300"
                                required>
                            <button type="button" onclick="togglePasswordVisibility()">
                                <img id="iconPassword" src="https://cdn-icons-png.flaticon.com/512/6684/6684701.png"
                                    alt="ver/noVer" class="w-6 h-6 m-2 ">
                            </button>
                        </div>
                    </div>

                    <div class="mb-6">
                        <label for="RPassword" class="block text-gray-700 font-bold mb-2">Repeat password</label>
                        <div class="flex flex-row ">
                            <input type="password" id="RPassword" name="RPassword"
                                class="w-full px-3 py-2 border rounded-2xl border-gray-300 focus:outline-none focus:ring focus:border-blue-300"
                                required>
                            <button type="button" onclick="toggleRPasswordVisibility()">
                                <img id="iconRPassword" src="https://cdn-icons-png.flaticon.com/512/6684/6684701.png"
                                    alt="ver/noVer" class="w-6 h-6 m-2 ">
                            </button>
                        </div>
                    </div>
                    <div class="flex flex-col gap-4 pb-5">
                        <button onclick="nextStep()" class=" bg-gradient-to-r from-[#23CCE8] to-[#0FF0DE]
                        text-white font-bold py-3 px-8 rounded-3xl shadow-md 
                        hover:shadow-xl hover:scale-105 transition duration-300 ease-in-out">
                            Siguiente
                        </button>
                    </div>
                </div>
                <div id="step2" class="step-content hidden">
                    <div class="mb-6">
                        <label for="rol" class="block text-gray-700 font-bold mb-2">Rol</label>
                        <select id="rol" name="rol" class="w-full px-3 py-2 border border-gray-300 rounded" required>
                            <option value="">Seleccione su departamento</option>
                            <option value="Fotografia">Fotografía</option>
                            <option value="Arte">Arte</option>
                            <option value="Luces">Luces</option>
                            <option value="Sonido">Sonido</option>
                            <option value="Direccion">Dirección</option>
                            <option value="Produccion">Producción</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-4 pb-5">
                        <button onclick="nextStep()" class=" bg-gradient-to-r from-[#23CCE8] to-[#0FF0DE]
                        text-white font-bold py-3 px-8 rounded-3xl shadow-md 
                        hover:shadow-xl hover:scale-105 transition duration-300 ease-in-out">
                            Siguiente
                        </button>
                    </div>

                </div>
                <div id="step3" class="step-content hidden">
                    <label for="perfil" class="inline-block block text-gray-700 font-bold">Perfil</label>
                    <div class="relative inline-block group">
                        <span class="text-blue-500 cursor-help hover:text-blue-700">
                            <img src="https://cdn-icons-png.flaticon.com/512/1/1176.png" class="w-5" alt="" srcset="">
                        </span>
                        <!-- Esto es el mensaje que se abre -->
                        <div class="absolute bottom-full left-1/2 transform -translate-x-1/2 
                        px-3 py-2 mb-2 w-max text-sm text-white bg-gray-800 
                        rounded-lg shadow-lg opacity-0 pointer-events-none 
                        group-hover:opacity-100 group-hover:visible transition duration-300">

                            Esta es una pista de ayuda para el campo de entrada.
                            <svg class="absolute text-gray-800 h-2 w-full left-0 bottom-[-7px]" x="0px" y="0px"
                                viewBox="0 0 255 255">
                                <polygon class="fill-current" points="0,0 127.5,127.5 255,0" />
                            </svg>
                        </div>
                    </div>
                    <textarea id="mensaje" name="mensaje" rows="4" class="w-full h-40 p-3 border border-gray-300 rounded-3xl
                    focus:outline-none focus:ring-2 focus:ring-blue-300 
                    resize-y transition duration-150 ease-in-out" placeholder="Soy gaffer con amplia experiencia en...
(500 caracteres max)" maxlength="500" required></textarea>

                    <div class=" flex flex-col gap-4 pb-4">
                        <button type="submit" class="bg-gradient-to-r from-[#23CCE8] to-[#0FF0DE]
                        text-white font-bold py-3 px-8 rounded-3xl shadow-md 
                        hover:shadow-xl hover:scale-105 transition duration-300 ease-in-out">Registrar
                        </button>
                    </div>
                </div>

            </form>
            <div class="flex gap-4 items-center justify-center pb-5">
                <div id=indicatorStep1 class="w-2 h-2 bg-blue-400 rounded-full shadow-md"></div>
                <div id="indicatorStep2" class="w-2 h-2 bg-gray-400 rounded-full shadow-md"></div>
                <div id="indicatorStep3" class="w-2 h-2 bg-gray-400 rounded-full shadow-md"></div>
            </div>
            <p class="text-sm text-center">¿Si ya tienes cuenta?
                <a href="login.html" class="text-blue-500">Inicia aquí</a>
            </p>
        </div>
    </div>
    </div>
    
    <script src="./js/microservices/convocatoria.js"></script>
    <script src="./js/microservices/postulante.js"></script>
    <script src="./js/microservices/usuarios.js"></script>
    <script src="./js/utilities.js"></script>
</body>

</html>
